<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CSS Gradient Generator</title>

<meta name="description"
content="Generate beautiful CSS gradients instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:850px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

.gradient-box{
    width:100%;
    height:250px;
    border-radius:14px;
    margin-top:25px;
    background:linear-gradient(90deg,#3b82f6,#22c55e);
}

.controls{
    margin-top:30px;
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.control{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

input[type="color"]{
    width:90px;
    height:60px;
    border:none;
    background:none;
    cursor:pointer;
}

select{
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    word-break:break-word;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>CSS Gradient Generator</h1>

<p>
Generate beautiful CSS gradients instantly.
</p>

<div class="gradient-box"
id="gradientBox"></div>

<div class="controls">

<div class="control">

<p>Color 1</p>

<input
type="color"
id="color1"
value="#3b82f6"
oninput="generateGradient()">

</div>

<div class="control">

<p>Color 2</p>

<input
type="color"
id="color2"
value="#22c55e"
oninput="generateGradient()">

</div>

<div class="control">

<p>Direction</p>

<select
id="direction"
onchange="generateGradient()">

<option value="90deg">
Left → Right
</option>

<option value="180deg">
Top → Bottom
</option>

<option value="45deg">
Diagonal
</option>

<option value="270deg">
Bottom → Top
</option>

</select>

</div>

</div>

<div class="output"
id="output">
CSS code will appear here...
</div>

<button onclick="copyCSS()">
Copy CSS
</button>

<div class="note">
Useful for UI design, websites & modern apps.
</div>

</div>

<script>

function generateGradient(){

    const color1 =
    document.getElementById("color1").value;

    const color2 =
    document.getElementById("color2").value;

    const direction =
    document.getElementById("direction").value;

    const gradient =

    `linear-gradient(${direction},
    ${color1},
    ${color2})`;

    document.getElementById("gradientBox")
    .style.background = gradient;

    document.getElementById("output")
    .innerText =

    "background: " +
    gradient + ";";

}

function copyCSS(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("CSS copied!");

}

generateGradient();

</script>

</body>
</html>
