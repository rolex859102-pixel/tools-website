<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CSV to JSON Converter</title>

<meta name="description"
content="Convert CSV to JSON online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    text-align:left;
    overflow:auto;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<h1>CSV to JSON Converter</h1>

<p>
Convert CSV data into JSON instantly.
</p>

<textarea
id="csvInput"
placeholder="name,age
John,25
Alex,30"></textarea>

<button onclick="convertCSV()">
Convert to JSON
</button>

<div class="result"
id="result">

JSON output will appear here.

</div>

</div>

<script>

function convertCSV(){

    const csv =
    document.getElementById("csvInput")
    .value.trim();

    if(csv === ""){

        alert("Please enter CSV data");

        return;
    }

    const lines = csv.split("\n");

    const headers =
    lines[0].split(",");

    let result = [];

    for(let i = 1; i < lines.length; i++){

        let obj = {};

        let currentline =
        lines[i].split(",");

        headers.forEach((header, index)=>{

            obj[header.trim()] =
            currentline[index].trim();

        });

        result.push(obj);

    }

    document.getElementById("result")
    .textContent =
    JSON.stringify(result, null, 2);

}

</script>

</body>
</html>
