<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Resume Builder Online Free</title>

<meta name="description"
content="Create professional resume online free. Simple CV maker with instant preview.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

textarea{
    height:120px;
    resize:none;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.resume-preview{
    margin-top:30px;
    background:white;
    color:black;
    padding:30px;
    border-radius:10px;
    text-align:left;
}

.resume-preview h2{
    margin-bottom:5px;
}

.resume-preview hr{
    margin:20px 0;
}

</style>

</head>

<body>

<div class="container">

<h1>Resume Builder</h1>

<p>Create professional resume online free.</p>

<input type="text"
id="name"
placeholder="Full Name">

<input type="text"
id="email"
placeholder="Email Address">

<input type="text"
id="phone"
placeholder="Phone Number">

<textarea id="skills"
placeholder="Skills"></textarea>

<textarea id="education"
placeholder="Education"></textarea>

<textarea id="experience"
placeholder="Work Experience"></textarea>

<button onclick="generateResume()">
Generate Resume
</button>

<div class="resume-preview"
id="resumePreview">

<h2>Your Resume Preview</h2>

<p>
Fill the details and click generate.
</p>

</div>

</div>

<script>

function generateResume(){

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const phone =
    document.getElementById("phone").value;

    const skills =
    document.getElementById("skills").value;

    const education =
    document.getElementById("education").value;

    const experience =
    document.getElementById("experience").value;

    document.getElementById("resumePreview")
    .innerHTML = `

    <h2>${name}</h2>

    <p>
    ${email} | ${phone}
    </p>

    <hr>

    <h3>Skills</h3>

    <p>${skills}</p>

    <h3>Education</h3>

    <p>${education}</p>

    <h3>Experience</h3>

    <p>${experience}</p>

    `;

}

</script>

</body>
</html>
