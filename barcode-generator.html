<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Barcode Generator Online Free</title>

<meta name="description"
content="Generate barcodes online free instantly using barcode generator tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:750px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.barcode-box{
    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:12px;
}

svg{
    width:100%;
    max-width:500px;
}

</style>

</head>

<body>

<div class="container">

<h1>Barcode Generator</h1>

<p>
Generate barcode instantly online.
</p>

<input type="text"
id="barcodeText"
placeholder="Enter barcode text">

<button onclick="generateBarcode()">
Generate Barcode
</button>

<div class="barcode-box">

<svg id="barcode"></svg>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script>

function generateBarcode(){

    const text =
    document.getElementById("barcodeText").value;

    if(text.trim() === ""){

        alert("Please enter text");

        return;
    }

    JsBarcode("#barcode", text, {
        format: "CODE128",
        lineColor: "#000",
        width: 2,
        height: 100,
        displayValue: true
    });

}

</script>

</body>
</html>
