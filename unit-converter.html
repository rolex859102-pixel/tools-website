<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Unit Converter Online Free</title>

<meta name="description"
content="Convert units online free instantly using unit converter tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input, select{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Unit Converter</h1>

<p>
Convert units instantly online.
</p>

<input type="number"
id="value"
placeholder="Enter value">

<select id="conversion">

<option value="cm-inch">
CM to Inch
</option>

<option value="inch-cm">
Inch to CM
</option>

<option value="kg-pound">
KG to Pound
</option>

<option value="pound-kg">
Pound to KG
</option>

<option value="km-mile">
KM to Mile
</option>

<option value="mile-km">
Mile to KM
</option>

</select>

<button onclick="convertUnit()">
Convert
</button>

<div class="result"
id="result">

Converted result will appear here.

</div>

</div>

<script>

function convertUnit(){

    const value =
    parseFloat(document.getElementById("value").value);

    const conversion =
    document.getElementById("conversion").value;

    if(isNaN(value)){

        alert("Please enter value");

        return;
    }

    let result = "";

    if(conversion === "cm-inch"){

        result = (value / 2.54).toFixed(2) + " Inch";
    }

    else if(conversion === "inch-cm"){

        result = (value * 2.54).toFixed(2) + " CM";
    }

    else if(conversion === "kg-pound"){

        result = (value * 2.20462).toFixed(2) + " Pound";
    }

    else if(conversion === "pound-kg"){

        result = (value / 2.20462).toFixed(2) + " KG";
    }

    else if(conversion === "km-mile"){

        result = (value * 0.621371).toFixed(2) + " Mile";
    }

    else if(conversion === "mile-km"){

        result = (value / 0.621371).toFixed(2) + " KM";
    }

    document.getElementById("result")
    .innerHTML = result;

}

</script>

</body>
</html>
