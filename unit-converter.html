<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Unit Converter Online Free</title>

<meta name="description"
content="Convert units online free. Length, weight and measurement converter tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    padding:20px;
    background:#1e293b;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Unit Converter</h1>

<p>
Convert length units instantly online.
</p>

<input type="number"
id="value"
placeholder="Enter value">

<select id="conversion">

<option value="cm-inch">
CM to Inch
</option>

<option value="inch-cm">
Inch to CM
</option>

<option value="kg-pound">
KG to Pound
</option>

<option value="pound-kg">
Pound to KG
</option>

<option value="meter-feet">
Meter to Feet
</option>

<option value="feet-meter">
Feet to Meter
</option>

</select>

<button onclick="convertUnit()">
Convert
</button>

<div class="result"
id="result">

Result will appear here.

</div>

</div>

<script>

function convertUnit(){

    const value =
    parseFloat(document.getElementById("value").value);

    const type =
    document.getElementById("conversion").value;

    if(isNaN(value)){

        alert("Please enter value");

        return;
    }

    let result = "";

    if(type === "cm-inch"){
        result = (value / 2.54).toFixed(2) + " Inch";
    }

    else if(type === "inch-cm"){
        result = (value * 2.54).toFixed(2) + " CM";
    }

    else if(type === "kg-pound"){
        result = (value * 2.20462).toFixed(2) + " Pound";
    }

    else if(type === "pound-kg"){
        result = (value / 2.20462).toFixed(2) + " KG";
    }

    else if(type === "meter-feet"){
        result = (value * 3.28084).toFixed(2) + " Feet";
    }

    else if(type === "feet-meter"){
        result = (value / 3.28084).toFixed(2) + " Meter";
    }

    document.getElementById("result")
    .innerHTML = result;

}

</script>

</body>
</html>
