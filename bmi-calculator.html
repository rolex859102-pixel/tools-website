<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BMI Calculator Online Free</title>

<meta name="description"
content="Calculate your BMI online free instantly using body mass index calculator.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>BMI Calculator</h1>

<p>
Check your Body Mass Index instantly.
</p>

<input type="number"
id="weight"
placeholder="Weight in KG">

<input type="number"
id="height"
placeholder="Height in CM">

<button onclick="calculateBMI()">
Calculate BMI
</button>

<div class="result"
id="result">

Your BMI result will appear here.

</div>

</div>

<script>

function calculateBMI(){

    const weight =
    parseFloat(document.getElementById("weight").value);

    const heightCm =
    parseFloat(document.getElementById("height").value);

    if(isNaN(weight) || isNaN(heightCm)){

        alert("Please enter valid values");

        return;
    }

    const height =
    heightCm / 100;

    const bmi =
    (weight / (height * height)).toFixed(1);

    let status = "";

    if(bmi < 18.5){
        status = "Underweight";
    }

    else if(bmi < 25){
        status = "Normal";
    }

    else if(bmi < 30){
        status = "Overweight";
    }

    else{
        status = "Obese";
    }

    document.getElementById("result")
    .innerHTML = `
    BMI: ${bmi}<br>
    ${status}
    `;

}

</script>

</body>
</html>
