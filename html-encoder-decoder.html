<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HTML Encoder Decoder Online</title>

<meta name="description"
content="Encode and decode HTML entities online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-right:10px;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
    word-break:break-word;
}

</style>

</head>

<body>

<div class="container">

<h1>HTML Encoder Decoder</h1>

<p>
Encode and decode HTML entities instantly.
</p>

<textarea
id="htmlInput"
placeholder="<h1>Hello World</h1>"></textarea>

<button onclick="encodeHTML()">
Encode HTML
</button>

<button onclick="decodeHTML()">
Decode HTML
</button>

<div class="result"
id="result">

Result will appear here.

</div>

</div>

<script>

function encodeHTML(){

    const text =
    document.getElementById("htmlInput").value;

    if(text.trim() === ""){

        alert("Please enter HTML");

        return;
    }

    const encoded =
    text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

    document.getElementById("result")
    .innerText = encoded;

}

function decodeHTML(){

    const text =
    document.getElementById("htmlInput").value;

    if(text.trim() === ""){

        alert("Please enter encoded HTML");

        return;
    }

    const textarea =
    document.createElement("textarea");

    textarea.innerHTML = text;

    document.getElementById("result")
    .innerText = textarea.value;

}

</script>

</body>
</html>
