<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Flexbox Generator</title>

<meta name="description"
content="Generate CSS Flexbox layouts instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

.controls{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.control{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.preview{
    margin-top:35px;
    min-height:300px;
    background:#1e293b;
    border-radius:14px;
    padding:20px;
    display:flex;
    gap:10px;
}

.item{
    width:80px;
    height:80px;
    background:#3b82f6;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

@media(max-width:850px){

.controls{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Flexbox Generator</h1>

<p style="text-align:center;">
Create responsive Flexbox layouts instantly.
</p>

<div class="controls">

<div class="control">

<p>Flex Direction</p>

<select
id="direction"
onchange="generateFlex()">

<option value="row">
row
</option>

<option value="column">
column
</option>

<option value="row-reverse">
row-reverse
</option>

<option value="column-reverse">
column-reverse
</option>

</select>

</div>

<div class="control">

<p>Justify Content</p>

<select
id="justify"
onchange="generateFlex()">

<option value="flex-start">
flex-start
</option>

<option value="center">
center
</option>

<option value="space-between">
space-between
</option>

<option value="space-around">
space-around
</option>

<option value="space-evenly">
space-evenly
</option>

</select>

</div>

<div class="control">

<p>Align Items</p>

<select
id="align"
onchange="generateFlex()">

<option value="stretch">
stretch
</option>

<option value="center">
center
</option>

<option value="flex-start">
flex-start
</option>

<option value="flex-end">
flex-end
</option>

</select>

</div>

</div>

<div class="preview"
id="preview">

<div class="item">1</div>
<div class="item">2</div>
<div class="item">3</div>

</div>

<div class="output"
id="output">
CSS code will appear here...
</div>

<button onclick="copyCSS()">
Copy CSS
</button>

<div class="note">
Useful for responsive web design & CSS layouts.
</div>

</div>

<script>

function generateFlex(){

    const direction =
    document.getElementById("direction").value;

    const justify =
    document.getElementById("justify").value;

    const align =
    document.getElementById("align").value;

    const preview =
    document.getElementById("preview");

    preview.style.flexDirection =
    direction;

    preview.style.justifyContent =
    justify;

    preview.style.alignItems =
    align;

    const css =

`display: flex;
flex-direction: ${direction};
justify-content: ${justify};
align-items: ${align};`;

    document.getElementById("output")
    .innerText = css;

}

function copyCSS(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("CSS copied!");

}

generateFlex();

</script>

</body>
</html>
