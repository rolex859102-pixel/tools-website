<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Password Strength Checker</title>

<meta name="description"
content="Check password strength online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
    background:#1e293b;
}

</style>

</head>

<body>

<div class="container">

<h1>Password Strength Checker</h1>

<p>
Check your password security instantly.
</p>

<input type="password"
id="password"
placeholder="Enter password"
onkeyup="checkPassword()">

<div class="result"
id="result">

Password strength will appear here.

</div>

</div>

<script>

function checkPassword(){

    const password =
    document.getElementById("password").value;

    let strength = "";
    let score = 0;

    if(password.length >= 8){
        score++;
    }

    if(/[A-Z]/.test(password)){
        score++;
    }

    if(/[0-9]/.test(password)){
        score++;
    }

    if(/[\W]/.test(password)){
        score++;
    }

    if(score <= 1){
        strength = "❌ Weak Password";
    }

    else if(score === 2 || score === 3){
        strength = "⚠ Medium Password";
    }

    else{
        strength = "✅ Strong Password";
    }

    document.getElementById("result")
    .innerHTML = strength;

}

</script>

</body>
</html>
