<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Password Strength Checker</title>

<meta name="description"
content="Check password strength online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

.strength-box{
    margin-top:25px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
}

.bar{
    width:100%;
    height:18px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin-top:15px;
}

.fill{
    height:100%;
    width:0%;
    transition:0.4s;
}

.result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.tip{
    margin-top:15px;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>Password Strength Checker</h1>

<p>
Check password security instantly.
</p>

<input
type="password"
id="password"
placeholder="Enter password"
oninput="checkStrength()">

<div class="strength-box">

<div class="bar">
<div class="fill"
id="fill"></div>
</div>

<div class="result"
id="result">
Password strength will appear here.
</div>

<div class="tip"
id="tip"></div>

</div>

</div>

<script>

function checkStrength(){

    const password =
    document.getElementById("password").value;

    const fill =
    document.getElementById("fill");

    const result =
    document.getElementById("result");

    const tip =
    document.getElementById("tip");

    let strength = 0;

    if(password.length >= 8){
        strength += 25;
    }

    if(/[A-Z]/.test(password)){
        strength += 25;
    }

    if(/[0-9]/.test(password)){
        strength += 25;
    }

    if(/[\W]/.test(password)){
        strength += 25;
    }

    fill.style.width = strength + "%";

    if(strength <= 25){

        fill.style.background = "#ef4444";

        result.innerHTML = "❌ Weak Password";

        tip.innerHTML =
        "Use uppercase, numbers & symbols.";

    }

    else if(strength <= 50){

        fill.style.background = "#f59e0b";

        result.innerHTML = "⚠ Medium Password";

        tip.innerHTML =
        "Add more security layers.";

    }

    else if(strength <= 75){

        fill.style.background = "#38bdf8";

        result.innerHTML = "✅ Good Password";

        tip.innerHTML =
        "Your password is fairly secure.";

    }

    else{

        fill.style.background = "#22c55e";

        result.innerHTML = "🔥 Strong Password";

        tip.innerHTML =
        "Excellent password security.";

    }

}

</script>

</body>
</html>
