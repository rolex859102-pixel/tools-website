<!DOCTYPE html>
<html>
<head>
<title>URL Encoder Decoder</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

.container{
width:75%;
margin:auto;
margin-top:40px;
}

textarea{
width:100%;
height:150px;
padding:10px;
font-size:16px;
}

button{
padding:10px 20px;
margin:10px;
background:#2196F3;
color:white;
border:none;
cursor:pointer;
}

#result{
margin-top:20px;
background:white;
padding:15px;
font-size:18px;
word-wrap:break-word;
}

</style>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

<h1>URL Encoder / Decoder</h1>

<textarea id="inputText" placeholder="Enter text or URL"></textarea>

<br>

<button onclick="encodeURL()">Encode</button>
<button onclick="decodeURL()">Decode</button>

<div id="result"></div>

</div>

<script>

function encodeURL(){

let text=document.getElementById("inputText").value;

let encoded=encodeURIComponent(text);

document.getElementById("result").innerText=encoded;

}

function decodeURL(){

let text=document.getElementById("inputText").value;

let decoded=decodeURIComponent(text);

document.getElementById("result").innerText=decoded;

}

</script>

</body>
</html>
