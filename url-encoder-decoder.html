<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>URL Encoder Decoder</title>

<meta name="description"
content="Encode and decode URLs instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.encode{
    background:#3b82f6;
    color:white;
}

.decode{
    background:#f59e0b;
    color:white;
}

.copy{
    background:#22c55e;
    color:white;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>URL Encoder Decoder</h1>

<p style="text-align:center;">
Encode & decode URLs instantly.
</p>

<textarea
id="input"
placeholder="Paste URL or text here..."></textarea>

<div class="buttons">

<button class="encode"
onclick="encodeURL()">
Encode URL
</button>

<button class="decode"
onclick="decodeURL()">
Decode URL
</button>

<button class="copy"
onclick="copyOutput()">
Copy Output
</button>

</div>

<textarea
id="output"
placeholder="Result will appear here..."></textarea>

<div class="note">
Useful for APIs, query strings & web development.
</div>

</div>

<script>

function encodeURL(){

    let input =
    document.getElementById("input").value;

    let encoded =
    encodeURIComponent(input);

    document.getElementById("output")
    .value = encoded;

}

function decodeURL(){

    let input =
    document.getElementById("input").value;

    try{

        let decoded =
        decodeURIComponent(input);

        document.getElementById("output")
        .value = decoded;

    }

    catch{

        document.getElementById("output")
        .value =
        "Invalid encoded URL";

    }

}

function copyOutput(){

    const output =
    document.getElementById("output");

    output.select();

    document.execCommand("copy");

    alert("Output copied!");

}

</script>

</body>
</html>
