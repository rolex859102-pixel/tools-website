<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>URL Encoder Decoder Online</title>

<meta name="description"
content="Encode and decode URLs online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-right:10px;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
    word-break:break-word;
}

</style>

</head>

<body>

<div class="container">

<h1>URL Encoder Decoder</h1>

<p>
Encode and decode URLs instantly.
</p>

<textarea
id="urlInput"
placeholder="Enter URL or text here..."></textarea>

<button onclick="encodeURL()">
Encode URL
</button>

<button onclick="decodeURL()">
Decode URL
</button>

<div class="result"
id="result">

Result will appear here.

</div>

</div>

<script>

function encodeURL(){

    const text =
    document.getElementById("urlInput").value;

    if(text.trim() === ""){

        alert("Please enter text");

        return;
    }

    const encoded =
    encodeURIComponent(text);

    document.getElementById("result")
    .innerText = encoded;

}

function decodeURL(){

    const text =
    document.getElementById("urlInput").value;

    if(text.trim() === ""){

        alert("Please enter encoded URL");

        return;
    }

    try{

        const decoded =
        decodeURIComponent(text);

        document.getElementById("result")
        .innerText = decoded;

    }

    catch(error){

        document.getElementById("result")
        .innerText =
        "Invalid Encoded URL";

    }

}

</script>

</body>
</html>
