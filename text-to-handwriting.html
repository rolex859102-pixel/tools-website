<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Text to Handwriting Converter</title>

<meta name="description"
content="Convert text into handwriting online free. Download handwriting image instantly.">

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
    resize:none;
}

.preview{
    margin-top:25px;
    background:white;
    color:black;
    min-height:300px;
    padding:30px;
    border-radius:10px;
    text-align:left;
    line-height:2;
    font-size:28px;
    font-family:'Patrick Hand', cursive;
    white-space:pre-wrap;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>Text to Handwriting</h1>

<p>
Convert typed text into handwriting style instantly.
</p>

<textarea id="textInput"
placeholder="Type your text here..."></textarea>

<br>

<button onclick="convertText()">
Generate Handwriting
</button>

<div class="preview"
id="preview">
Your handwriting preview will appear here
</div>

</div>

<script>

function convertText(){

    const text =
    document.getElementById("textInput").value;

    document.getElementById("preview")
    .innerText = text;

}

</script>

</body>
</html>
