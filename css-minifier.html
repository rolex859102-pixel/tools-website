<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CSS Minifier Online</title>

<meta name="description"
content="Minify CSS online free instantly using CSS minifier tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-right:10px;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
    word-break:break-word;
}

</style>

</head>

<body>

<div class="container">

<h1>CSS Minifier</h1>

<p>
Compress and minify CSS instantly.
</p>

<textarea
id="cssInput"
placeholder="Enter CSS code here..."></textarea>

<button onclick="minifyCSS()">
Minify CSS
</button>

<button onclick="copyCSS()">
Copy
</button>

<div class="result"
id="result">

Minified CSS will appear here.

</div>

</div>

<script>

function minifyCSS(){

    let css =
    document.getElementById("cssInput").value;

    if(css.trim() === ""){

        alert("Please enter CSS");

        return;
    }

    css = css
    .replace(/\/\*[\s\S]*?\*\//g, "")
    .replace(/\s+/g, " ")
    .replace(/\s*{\s*/g, "{")
    .replace(/\s*}\s*/g, "}")
    .replace(/\s*;\s*/g, ";")
    .replace(/\s*:\s*/g, ":")
    .replace(/\s*,\s*/g, ",")
    .trim();

    document.getElementById("result")
    .innerText = css;

}

function copyCSS(){

    const text =
    document.getElementById("result")
    .innerText;

    navigator.clipboard.writeText(text);

    alert("CSS copied");

}

</script>

</body>
</html>
