<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Merge PDF Online Free</title>

<meta name="description"
content="Merge PDF files online free. Combine multiple PDFs into one PDF instantly.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    margin-top:20px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#downloadBtn{
    display:none;
    margin-top:20px;
    padding:12px 20px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    display:inline-block;
}

.info{
    margin-top:20px;
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<h1>Merge PDF Tool</h1>

<p>
Combine multiple PDF files into one PDF.
</p>

<input type="file"
id="pdfInput"
accept=".pdf"
multiple>

<br>

<button onclick="mergePDFs()">
Merge PDFs
</button>

<div class="info" id="info"></div>

<br>

<a id="downloadBtn">
Download Merged PDF
</a>

</div>

<script>

async function mergePDFs(){

    const input =
    document.getElementById("pdfInput");

    if(input.files.length < 2){

        alert("Upload at least 2 PDFs");

        return;

    }

    const mergedPdf =
    await PDFLib.PDFDocument.create();

    for(const file of input.files){

        const arrayBuffer =
        await file.arrayBuffer();

        const pdf =
        await PDFLib.PDFDocument.load(
            arrayBuffer
        );

        const copiedPages =
        await mergedPdf.copyPages(
            pdf,
            pdf.getPageIndices()
        );

        copiedPages.forEach(page=>{

            mergedPdf.addPage(page);

        });

    }

    const mergedBytes =
    await mergedPdf.save();

    const blob =
    new Blob(
        [mergedBytes],
        {type:"application/pdf"}
    );

    const url =
    URL.createObjectURL(blob);

    document.getElementById("info")
    .innerHTML =
    "PDFs merged successfully";

    const downloadBtn =
    document.getElementById("downloadBtn");

    downloadBtn.href = url;

    downloadBtn.download =
    "merged-pdf.pdf";

    downloadBtn.style.display =
    "inline-block";

}

</script>

</body>
</html>
