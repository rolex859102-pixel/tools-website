<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Markdown Editor</title>

<meta name="description"
content="Write and preview Markdown online instantly free.">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

.editor{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:25px;
}

textarea{
    width:100%;
    height:500px;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

.preview{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    overflow:auto;
    min-height:500px;
    text-align:left;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

@media(max-width:900px){

.editor{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Markdown Editor</h1>

<p style="text-align:center;">
Write Markdown with live preview.
</p>

<div class="editor">

<textarea
id="markdown"
placeholder="Write Markdown here..."
oninput="updatePreview()">

# Hello World

## Markdown Editor

- Live Preview
- Fast Editing
- Developer Friendly

</textarea>

<div class="preview"
id="preview"></div>

</div>

<button onclick="copyMarkdown()">
Copy Markdown
</button>

<div class="note">
Useful for GitHub, blogs & documentation writing.
</div>

</div>

<script>

function updatePreview(){

    const markdown =
    document.getElementById("markdown").value;

    document.getElementById("preview")
    .innerHTML =
    marked.parse(markdown);

}

function copyMarkdown(){

    const markdown =
    document.getElementById("markdown");

    markdown.select();

    document.execCommand("copy");

    alert("Markdown copied!");

}

updatePreview();

</script>

</body>
</html>
