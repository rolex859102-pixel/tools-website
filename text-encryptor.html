<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Text Encryptor & Decryptor</title>

<meta name="description"
content="Encrypt and decrypt text online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    resize:none;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.encrypt{
    background:#22c55e;
    color:white;
}

.decrypt{
    background:#3b82f6;
    color:white;
}

.copy{
    background:#f59e0b;
    color:white;
}

.output{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    word-break:break-word;
    min-height:120px;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>Text Encryptor & Decryptor</h1>

<p style="text-align:center;">
Encrypt or decrypt text instantly online.
</p>

<textarea
id="inputText"
placeholder="Enter your text here..."></textarea>

<div class="buttons">

<button class="encrypt"
onclick="encryptText()">
Encrypt
</button>

<button class="decrypt"
onclick="decryptText()">
Decrypt
</button>

<button class="copy"
onclick="copyOutput()">
Copy Output
</button>

</div>

<div class="output"
id="output">
Result will appear here...
</div>

<div class="note">
Uses Base64 encoding for quick text conversion.
</div>

</div>

<script>

function encryptText(){

    let text =
    document.getElementById("inputText").value;

    if(text.trim() === ""){
        alert("Please enter text");
        return;
    }

    let encrypted =
    btoa(unescape(encodeURIComponent(text)));

    document.getElementById("output")
    .innerText = encrypted;
}

function decryptText(){

    let text =
    document.getElementById("inputText").value;

    if(text.trim() === ""){
        alert("Please enter encrypted text");
        return;
    }

    try{

        let decrypted =
        decodeURIComponent(escape(atob(text)));

        document.getElementById("output")
        .innerText = decrypted;

    }

    catch{

        document.getElementById("output")
        .innerText =
        "Invalid encrypted text.";

    }

}

function copyOutput(){

    let output =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(output);

    alert("Output copied!");
}

</script>

</body>
</html>
