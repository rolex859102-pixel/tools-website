<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JSON Validator Online</title>

<meta name="description"
content="Validate JSON online free instantly using JSON validator tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:250px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
    word-break:break-word;
    font-size:16px;
}

.valid{
    color:#22c55e;
    font-weight:bold;
}

.invalid{
    color:#ef4444;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>JSON Validator</h1>

<p>
Validate JSON instantly online.
</p>

<textarea
id="jsonInput"
placeholder='{"name":"John","age":25}'></textarea>

<button onclick="validateJSON()">
Validate JSON
</button>

<div class="result"
id="result">

Validation result will appear here.

</div>

</div>

<script>

function validateJSON(){

    const json =
    document.getElementById("jsonInput").value;

    if(json.trim() === ""){

        alert("Please enter JSON");

        return;
    }

    try{

        const parsed =
        JSON.parse(json);

        document.getElementById("result")
        .innerHTML =
        "<span class='valid'>✅ Valid JSON</span>\n\n" +
        JSON.stringify(parsed, null, 2);

    }

    catch(error){

        document.getElementById("result")
        .innerHTML =
        "<span class='invalid'>❌ Invalid JSON</span>\n\n" +
        error.message;

    }

}

</script>

</body>
</html>
