<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Color Picker Tool</title>

<meta name="description"
content="Pick colors and get HEX RGB values instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:750px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

.color-box{
    width:100%;
    height:220px;
    border-radius:14px;
    margin-top:25px;
    border:4px solid #1e293b;
}

input[type="color"]{
    margin-top:25px;
    width:120px;
    height:70px;
    border:none;
    background:none;
    cursor:pointer;
}

.values{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    line-height:2;
    font-size:20px;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>Color Picker Tool</h1>

<p>
Pick colors & get HEX / RGB codes instantly.
</p>

<div class="color-box"
id="colorBox"></div>

<input
type="color"
id="picker"
value="#3b82f6"
oninput="updateColor()">

<div class="values"
id="values">

HEX: #3b82f6

<br>

RGB: rgb(59,130,246)

</div>

<button onclick="copyColor()">
Copy HEX Code
</button>

<div class="note">
Useful for web design, UI/UX & graphic projects.
</div>

</div>

<script>

function updateColor(){

    const color =
    document.getElementById("picker").value;

    document.getElementById("colorBox")
    .style.background = color;

    const r =
    parseInt(color.substr(1,2),16);

    const g =
    parseInt(color.substr(3,2),16);

    const b =
    parseInt(color.substr(5,2),16);

    document.getElementById("values")
    .innerHTML =

    "HEX: " + color +

    "<br><br>" +

    "RGB: rgb(" +
    r + "," + g + "," + b + ")";

}

function copyColor(){

    const color =
    document.getElementById("picker").value;

    navigator.clipboard.writeText(color);

    alert("HEX color copied!");

}

updateColor();

</script>

</body>
</html>
