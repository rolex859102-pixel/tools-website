<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meme Generator Online Free</title>

<meta name="description"
content="Create funny memes online free instantly using meme generator tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.meme-box{
    position:relative;
    margin-top:30px;
}

.meme-box img{
    width:100%;
    border-radius:12px;
}

.top-text,
.bottom-text{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    width:90%;
}

.top-text{
    top:20px;
}

.bottom-text{
    bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Meme Generator</h1>

<p>
Create funny memes instantly.
</p>

<input type="text"
id="topText"
placeholder="Top Text">

<input type="text"
id="bottomText"
placeholder="Bottom Text">

<button onclick="generateMeme()">
Generate Meme
</button>

<div class="meme-box">

<img src="https://i.imgflip.com/1bij.jpg"
id="memeImage">

<div class="top-text"
id="topOutput"></div>

<div class="bottom-text"
id="bottomOutput"></div>

</div>

</div>

<script>

function generateMeme(){

    document.getElementById("topOutput")
    .innerHTML =
    document.getElementById("topText").value;

    document.getElementById("bottomOutput")
    .innerHTML =
    document.getElementById("bottomText").value;

}

</script>

</body>
</html>
