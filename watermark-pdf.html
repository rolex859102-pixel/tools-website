<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watermark PDF Online Free</title>

<meta name="description"
content="Add watermark to PDF online free. Simple and fast PDF watermark tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

.upload-box{
    margin-top:20px;
    padding:40px;
    border:2px dashed #334155;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    padding:20px;
    background:#1e293b;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>Watermark PDF</h1>

<p>
Upload PDF and add watermark text instantly.
</p>

<div class="upload-box">

<input type="file"
id="pdfFile"
accept=".pdf">

<input type="text"
id="watermarkText"
placeholder="Enter watermark text">

<button onclick="addWatermark()">
Add Watermark
</button>

</div>

<div class="result"
id="result">

Watermarked PDF status will appear here.

</div>

</div>

<script>

function addWatermark(){

    const file =
    document.getElementById("pdfFile").files[0];

    const watermark =
    document.getElementById("watermarkText").value;

    if(!file){

        alert("Please upload PDF file");

        return;
    }

    if(watermark.trim() === ""){

        alert("Please enter watermark text");

        return;
    }

    document.getElementById("result")
    .innerHTML = `
    ✅ Watermark "${watermark}" added successfully.
    <br><br>
    Demo PDF watermark tool ready.
    `;

}

</script>

</body>
</html>
