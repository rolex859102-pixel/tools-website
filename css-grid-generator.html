<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CSS Grid Generator</title>

<meta name="description"
content="Generate CSS Grid layouts instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

.controls{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.control{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.preview{
    margin-top:35px;
    min-height:350px;
    background:#1e293b;
    border-radius:14px;
    padding:20px;
    display:grid;
    gap:10px;
}

.item{
    background:#3b82f6;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    min-height:80px;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

@media(max-width:850px){

.controls{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>CSS Grid Generator</h1>

<p style="text-align:center;">
Create responsive CSS Grid layouts instantly.
</p>

<div class="controls">

<div class="control">

<p>Columns</p>

<input
type="number"
id="columns"
value="3"
min="1"
max="12"
oninput="generateGrid()">

</div>

<div class="control">

<p>Rows</p>

<input
type="number"
id="rows"
value="2"
min="1"
max="12"
oninput="generateGrid()">

</div>

<div class="control">

<p>Gap Size (px)</p>

<input
type="number"
id="gap"
value="10"
min="0"
max="100"
oninput="generateGrid()">

</div>

</div>

<div class="preview"
id="preview">

<div class="item">1</div>
<div class="item">2</div>
<div class="item">3</div>
<div class="item">4</div>
<div class="item">5</div>
<div class="item">6</div>

</div>

<div class="output"
id="output">
CSS code will appear here...
</div>

<button onclick="copyCSS()">
Copy CSS
</button>

<div class="note">
Useful for responsive layouts, dashboards & web apps.
</div>

</div>

<script>

function generateGrid(){

    const columns =
    document.getElementById("columns").value;

    const rows =
    document.getElementById("rows").value;

    const gap =
    document.getElementById("gap").value;

    const preview =
    document.getElementById("preview");

    preview.style.gridTemplateColumns =
    `repeat(${columns},1fr)`;

    preview.style.gridTemplateRows =
    `repeat(${rows},100px)`;

    preview.style.gap =
    `${gap}px`;

    const total =
    columns * rows;

    preview.innerHTML = "";

    for(let i=1;i<=total;i++){

        preview.innerHTML +=
        `<div class="item">${i}</div>`;

    }

    const css =

`display: grid;
grid-template-columns: repeat(${columns}, 1fr);
grid-template-rows: repeat(${rows}, 100px);
gap: ${gap}px;`;

    document.getElementById("output")
    .innerText = css;

}

function copyCSS(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("CSS copied!");

}

generateGrid();

</script>

</body>
</html>
