<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SQL Formatter</title>

<meta name="description"
content="Format and beautify SQL queries instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:15px;
    resize:none;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.format{
    background:#3b82f6;
    color:white;
}

.copy{
    background:#22c55e;
    color:white;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>SQL Formatter</h1>

<p style="text-align:center;">
Beautify SQL queries instantly.
</p>

<textarea
id="input"
placeholder="Paste SQL query here..."></textarea>

<div class="buttons">

<button class="format"
onclick="formatSQL()">
Format SQL
</button>

<button class="copy"
onclick="copySQL()">
Copy Output
</button>

</div>

<textarea
id="output"
placeholder="Formatted SQL will appear here..."></textarea>

<div class="note">
Useful for developers, debugging & database projects.
</div>

</div>

<script>

function formatSQL(){

    let sql =
    document.getElementById("input").value;

    const keywords = [
    "SELECT",
    "FROM",
    "WHERE",
    "ORDER BY",
    "GROUP BY",
    "HAVING",
    "INSERT INTO",
    "VALUES",
    "UPDATE",
    "SET",
    "DELETE",
    "INNER JOIN",
    "LEFT JOIN",
    "RIGHT JOIN",
    "LIMIT"
    ];

    keywords.forEach(keyword => {

        const regex =
        new RegExp(keyword,"gi");

        sql =
        sql.replace(regex,"\n" + keyword);

    });

    sql =
    sql.replace(/\n+/g,"\n")
    .trim();

    document.getElementById("output")
    .value = sql;

}

function copySQL(){

    const output =
    document.getElementById("output");

    output.select();

    document.execCommand("copy");

    alert("Formatted SQL copied!");

}

</script>

</body>
</html>
