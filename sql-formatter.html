<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SQL Formatter</title>

<meta name="description"
content="Format and beautify SQL queries instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:240px;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:16px;
    line-height:1.6;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.format{
    background:#3b82f6;
    color:white;
}

.copy{
    background:#22c55e;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    line-height:1.8;
}

.keyword{
    color:#38bdf8;
    font-weight:bold;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>SQL Formatter</h1>

<p style="text-align:center;">
Format & beautify SQL queries instantly.
</p>

<textarea
id="sql"
placeholder="Paste SQL query here..."></textarea>

<div class="buttons">

<button class="format"
onclick="formatSQL()">
Format SQL
</button>

<button class="copy"
onclick="copySQL()">
Copy SQL
</button>

<button class="clear"
onclick="clearSQL()">
Clear
</button>

</div>

<div class="output"
id="output">
Formatted SQL will appear here...
</div>

<div class="note">
Useful for databases, debugging & backend development.
</div>

</div>

<script>

function formatSQL(){

    let sql =
    document.getElementById("sql").value;

    const output =
    document.getElementById("output");

    if(sql.trim() === ""){

        output.innerHTML =
        "Please enter SQL query.";

        return;

    }

    const keywords = [

    "SELECT",
    "FROM",
    "WHERE",
    "AND",
    "OR",
    "ORDER BY",
    "GROUP BY",
    "INSERT INTO",
    "VALUES",
    "UPDATE",
    "SET",
    "DELETE",
    "INNER JOIN",
    "LEFT JOIN",
    "RIGHT JOIN",
    "LIMIT"

    ];

    keywords.forEach(keyword => {

        const regex =
        new RegExp(keyword,"gi");

        sql = sql.replace(regex,
        `\n${keyword}`);

    });

    output.innerHTML =

    sql.replace(
    /\b(SELECT|FROM|WHERE|AND|OR|ORDER BY|GROUP BY|INSERT INTO|VALUES|UPDATE|SET|DELETE|INNER JOIN|LEFT JOIN|RIGHT JOIN|LIMIT)\b/g,

    '<span class="keyword">$1</span>'

    );

}

function copySQL(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("SQL copied!");

}

function clearSQL(){

    document.getElementById("sql").value = "";

    document.getElementById("output")
    .innerHTML =
    "Formatted SQL will appear here...";

}

</script>

</body>
</html>
