<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SQL Formatter Online</title>

<meta name="description"
content="Format SQL queries online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
}

</style>

</head>

<body>

<div class="container">

<h1>SQL Formatter</h1>

<p>
Beautify and format SQL queries instantly.
</p>

<textarea
id="sqlInput"
placeholder="SELECT * FROM users WHERE age > 20"></textarea>

<button onclick="formatSQL()">
Format SQL
</button>

<div class="result"
id="result">

Formatted SQL will appear here.

</div>

</div>

<script>

function formatSQL(){

    let sql =
    document.getElementById("sqlInput").value;

    if(sql.trim() === ""){

        alert("Please enter SQL query");

        return;
    }

    const keywords = [
        "SELECT",
        "FROM",
        "WHERE",
        "ORDER BY",
        "GROUP BY",
        "INSERT INTO",
        "VALUES",
        "UPDATE",
        "SET",
        "DELETE",
        "INNER JOIN",
        "LEFT JOIN",
        "RIGHT JOIN",
        "LIMIT"
    ];

    keywords.forEach(keyword => {

        const regex =
        new RegExp(keyword, "gi");

        sql =
        sql.replace(regex, "\n" + keyword);

    });

    document.getElementById("result")
    .innerText = sql.trim();

}

</script>

</body>
</html>
