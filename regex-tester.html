<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Regex Tester</title>

<meta name="description"
content="Test regular expressions instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea,
input{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

textarea{
    height:220px;
    resize:none;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    line-height:2;
    word-break:break-word;
}

.match{
    color:#22c55e;
    font-weight:bold;
}

.nomatch{
    color:#ef4444;
    font-weight:bold;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

.highlight{
    background:#22c55e;
    color:black;
    padding:2px 4px;
    border-radius:4px;
}

</style>

</head>

<body>

<div class="container">

<h1>Regex Tester</h1>

<p style="text-align:center;">
Test regular expressions instantly.
</p>

<input
type="text"
id="regex"
placeholder="Enter regex pattern (example: \\d+)">

<textarea
id="text"
placeholder="Enter text to test regex..."></textarea>

<button onclick="testRegex()">
Test Regex
</button>

<div class="result"
id="result">
Regex results will appear here...
</div>

<div class="note">
Useful for validation, APIs & debugging.
</div>

</div>

<script>

function testRegex(){

    const pattern =
    document.getElementById("regex").value;

    const text =
    document.getElementById("text").value;

    const result =
    document.getElementById("result");

    if(pattern.trim() === ""){

        result.innerHTML =
        "Please enter regex pattern.";

        return;

    }

    try{

        const regex =
        new RegExp(pattern,"g");

        const matches =
        text.match(regex);

        if(matches){

            let highlighted =
            text.replace(regex,
            match =>
            `<span class="highlight">${match}</span>`);

            result.innerHTML =

            `<div class="match">
            ✅ Match Found
            </div>

            <br>

            Total Matches:
            ${matches.length}

            <br><br>

            ${highlighted}`;

        }

        else{

            result.innerHTML =

            `<div class="nomatch">
            ❌ No Match Found
            </div>`;

        }

    }

    catch(error){

        result.innerHTML =
        "Invalid Regex Pattern.";

    }

}

</script>

</body>
</html>
