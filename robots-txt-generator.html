<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Robots.txt Generator</title>

<meta name="description"
content="Generate robots.txt files instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

.form{
    margin-top:30px;
}

input,
textarea,
select{
    width:100%;
    padding:15px;
    margin-top:18px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

textarea{
    height:120px;
    resize:none;
}

button{
    margin-top:25px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.output{
    margin-top:35px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    line-height:1.8;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>Robots.txt Generator</h1>

<p style="text-align:center;">
Generate robots.txt files instantly.
</p>

<div class="form">

<select id="bot">

<option value="*">
All Search Engines
</option>

<option value="Googlebot">
Googlebot
</option>

<option value="Bingbot">
Bingbot
</option>

</select>

<input
type="text"
id="allow"
placeholder="Allow Path (example: /blog/)">

<input
type="text"
id="disallow"
placeholder="Disallow Path (example: /admin/)">

<input
type="text"
id="sitemap"
placeholder="Sitemap URL">

<button onclick="generateRobots()">
Generate Robots.txt
</button>

</div>

<div class="output"
id="output">
Generated robots.txt will appear here...
</div>

<div class="note">
Useful for SEO, crawling & Google indexing optimization.
</div>

</div>

<script>

function generateRobots(){

    const bot =
    document.getElementById("bot").value;

    const allow =
    document.getElementById("allow").value;

    const disallow =
    document.getElementById("disallow").value;

    const sitemap =
    document.getElementById("sitemap").value;

    const output =
    document.getElementById("output");

    let robots =

`User-agent: ${bot}

Allow: ${allow || "/"}

Disallow: ${disallow || ""}`;

    if(sitemap.trim() !== ""){

        robots +=

`\n
Sitemap: ${sitemap}`;

    }

    output.innerText = robots;

}

</script>

</body>
</html>
