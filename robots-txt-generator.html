<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Robots.txt Generator</title>

<meta name="description"
content="Generate robots.txt file instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

input, textarea{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

textarea{
    height:220px;
    resize:none;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.generate{
    background:#3b82f6;
    color:white;
}

.copy{
    background:#22c55e;
    color:white;
    margin-left:10px;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
    text-align:left;
    font-size:15px;
}

.note{
    margin-top:20px;
    color:#cbd5e1;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>Robots.txt Generator</h1>

<p style="text-align:center;">
Generate robots.txt file for SEO optimization.
</p>

<input
type="text"
id="agent"
placeholder="User-agent (Example: *)">

<textarea
id="disallow"
placeholder="Disallow paths (one per line)"></textarea>

<input
type="url"
id="sitemap"
placeholder="Sitemap URL">

<button class="generate"
onclick="generateRobots()">
Generate Robots.txt
</button>

<button class="copy"
onclick="copyRobots()">
Copy File
</button>

<div class="output"
id="output">
Generated robots.txt will appear here...
</div>

<div class="note">
Useful for search engine crawling & SEO control.
</div>

</div>

<script>

function generateRobots(){

    const agent =
    document.getElementById("agent").value || "*";

    const disallow =
    document.getElementById("disallow")
    .value
    .split("\n")
    .filter(path => path.trim() !== "")
    .map(path => "Disallow: " + path)
    .join("\n");

    const sitemap =
    document.getElementById("sitemap").value;

    const robots =

`User-agent: ${agent}

${disallow}

Sitemap: ${sitemap}`;

    document.getElementById("output")
    .innerText = robots;

}

function copyRobots(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("robots.txt copied!");

}

</script>

</body>
</html>
