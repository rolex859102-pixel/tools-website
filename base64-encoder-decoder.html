<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Base64 Encoder Decoder</title>

<meta name="description"
content="Encode and decode Base64 instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:220px;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.encode{
    background:#3b82f6;
    color:white;
}

.decode{
    background:#22c55e;
    color:white;
}

.copy{
    background:#f59e0b;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.8;
    overflow:auto;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>Base64 Encoder Decoder</h1>

<p style="text-align:center;">
Encode & decode Base64 instantly.
</p>

<textarea
id="input"
placeholder="Enter text or Base64 data here..."></textarea>

<div class="buttons">

<button class="encode"
onclick="encodeBase64()">
Encode
</button>

<button class="decode"
onclick="decodeBase64()">
Decode
</button>

<button class="copy"
onclick="copyOutput()">
Copy Output
</button>

<button class="clear"
onclick="clearAll()">
Clear
</button>

</div>

<div class="output"
id="output">
Result will appear here...
</div>

<div class="note">
Useful for APIs, authentication & data conversion.
</div>

</div>

<script>

function encodeBase64(){

    const input =
    document.getElementById("input").value;

    const output =
    document.getElementById("output");

    if(input.trim() === ""){

        output.innerHTML =
        "Please enter text.";

        return;

    }

    try{

        const encoded =
        btoa(input);

        output.innerText =
        encoded;

    }

    catch(error){

        output.innerText =
        "Encoding failed.";

    }

}

function decodeBase64(){

    const input =
    document.getElementById("input").value;

    const output =
    document.getElementById("output");

    if(input.trim() === ""){

        output.innerHTML =
        "Please enter Base64 data.";

        return;

    }

    try{

        const decoded =
        atob(input);

        output.innerText =
        decoded;

    }

    catch(error){

        output.innerText =
        "Invalid Base64 data.";

    }

}

function copyOutput(){

    const text =
    document.getElementById("output").innerText;

    navigator.clipboard.writeText(text);

    alert("Copied!");

}

function clearAll(){

    document.getElementById("input").value = "";

    document.getElementById("output")
    .innerText =
    "Result will appear here...";

}

</script>

</body>
</html>
