<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Base64 Encoder Decoder Online</title>

<meta name="description"
content="Encode and decode Base64 online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:220px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-right:10px;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
}

</style>

</head>

<body>

<div class="container">

<h1>Base64 Encoder / Decoder</h1>

<p>
Encode and decode Base64 instantly.
</p>

<textarea
id="inputText"
placeholder="Enter text here..."></textarea>

<button onclick="encodeText()">
Encode
</button>

<button onclick="decodeText()">
Decode
</button>

<div class="result"
id="result">

Result will appear here.

</div>

</div>

<script>

function encodeText(){

    const text =
    document.getElementById("inputText").value;

    try{

        const encoded =
        btoa(text);

        document.getElementById("result")
        .innerText = encoded;

    }

    catch(error){

        alert("Invalid text");

    }

}

function decodeText(){

    const text =
    document.getElementById("inputText").value;

    try{

        const decoded =
        atob(text);

        document.getElementById("result")
        .innerText = decoded;

    }

    catch(error){

        alert("Invalid Base64");

    }

}

</script>

</body>
</html>
