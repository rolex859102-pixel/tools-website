<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Cropper Tool Free Online</title>

<meta name="description"
content="Crop images online free. Easy image cropper tool for JPG, PNG and WEBP images.">

<meta name="robots" content="index, follow">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#94a3b8;
}

input{
    margin-top:20px;
}

canvas{
    max-width:100%;
    margin-top:20px;
    border:2px solid #334155;
    border-radius:10px;
    cursor:crosshair;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.download-btn{
    display:none;
    margin-top:20px;
    text-decoration:none;
    background:#3b82f6;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    display:inline-block;
}

footer{
    margin-top:40px;
    color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<h1>Image Cropper Tool</h1>

<p>Crop JPG, PNG and WEBP images online for free.</p>

<input type="file" id="fileInput" accept="image/*">

<br>

<canvas id="canvas"></canvas>

<br>

<button onclick="cropImage()">
Crop Image
</button>

<br>

<a id="downloadBtn" class="download-btn">
Download Cropped Image
</a>

</div>

<footer>
© 2026 Free Online Tools
</footer>

<script>

const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();

let startX,startY,endX,endY;
let dragging = false;

fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        img.onload = function(){

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img,0,0);

        }

        img.src = e.target.result;

    }

    reader.readAsDataURL(file);

});

canvas.addEventListener("mousedown", function(e){

    startX = e.offsetX;
    startY = e.offsetY;

    dragging = true;

});

canvas.addEventListener("mouseup", function(e){

    endX = e.offsetX;
    endY = e.offsetY;

    dragging = false;

    drawSelection();

});

function drawSelection(){

    ctx.drawImage(img,0,0);

    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        startX,
        startY,
        endX - startX,
        endY - startY
    );

}

function cropImage(){

    let width = endX - startX;
    let height = endY - startY;

    if(width <= 0 || height <= 0){
        alert("Please select crop area");
        return;
    }

    let tempCanvas = document.createElement("canvas");
    let tempCtx = tempCanvas.getContext("2d");

    tempCanvas.width = width;
    tempCanvas.height = height;

    tempCtx.drawImage(
        img,
        startX,
        startY,
        width,
        height,
        0,
        0,
        width,
        height
    );

    let croppedUrl = tempCanvas.toDataURL("image/png");

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let croppedImg = new Image();

    croppedImg.onload = function(){

        canvas.width = croppedImg.width;
        canvas.height = croppedImg.height;

        ctx.drawImage(croppedImg,0,0);

    }

    croppedImg.src = croppedUrl;

    let downloadBtn = document.getElementById("downloadBtn");

    downloadBtn.href = croppedUrl;
    downloadBtn.download = "cropped-image.png";

    downloadBtn.style.display = "inline-block";

}

</script>

</body>
</html>
