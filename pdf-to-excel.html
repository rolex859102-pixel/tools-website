<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PDF to Excel Converter Online Free</title>

<meta name="description"
content="Convert PDF to Excel online free. Easy PDF spreadsheet converter tool.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

.upload-box{
    margin-top:20px;
    padding:40px;
    border:2px dashed #334155;
    border-radius:12px;
}

input{
    margin-top:20px;
}

button{
    margin-top:20px;
    padding:12px 22px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    padding:20px;
    background:#1e293b;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF to Excel Converter</h1>

<p>
Upload PDF and convert to Excel format.
</p>

<div class="upload-box">

<input type="file"
id="pdfFile"
accept=".pdf">

<br>

<button onclick="convertPDF()">
Convert PDF
</button>

</div>

<div class="result"
id="result">

Converted file link will appear here.

</div>

</div>

<script>

function convertPDF(){

    const file =
    document.getElementById("pdfFile").files[0];

    if(!file){

        alert("Please upload PDF file");

        return;
    }

    document.getElementById("result")
    .innerHTML = `
    ✅ PDF uploaded successfully.
    <br><br>
    Demo converter ready.
    `;

}

</script>

</body>
</html>
