<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Random Password Generator</title>

<meta name="description"
content="Generate strong random passwords online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    text-align:center;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:25px;
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    font-size:22px;
    word-break:break-all;
}

</style>

</head>

<body>

<div class="container">

<h1>Random Password Generator</h1>

<p>
Generate secure passwords instantly.
</p>

<input type="number"
id="length"
placeholder="Password Length"
value="12">

<button onclick="generatePassword()">
Generate Password
</button>

<div class="result"
id="result">

Your password will appear here.

</div>

</div>

<script>

function generatePassword(){

    const length =
    parseInt(document.getElementById("length").value);

    const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";

    let password = "";

    for(let i = 0; i < length; i++){

        password +=
        chars.charAt(
        Math.floor(Math.random() * chars.length)
        );

    }

    document.getElementById("result")
    .innerHTML = password;

}

</script>

</body>
</html>
