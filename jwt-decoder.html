<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JWT Decoder Online</title>

<meta name="description"
content="Decode JWT token online free instantly.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
    text-align:center;
}

.container{
    max-width:950px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:left;
    white-space:pre-wrap;
    overflow:auto;
}

</style>

</head>

<body>

<div class="container">

<h1>JWT Decoder</h1>

<p>
Decode JWT tokens instantly online.
</p>

<textarea
id="jwtInput"
placeholder="Paste JWT token here"></textarea>

<button onclick="decodeJWT()">
Decode JWT
</button>

<div class="result"
id="result">

Decoded JWT will appear here.

</div>

</div>

<script>

function decodeJWT(){

    const token =
    document.getElementById("jwtInput").value.trim();

    if(token === ""){

        alert("Please enter JWT token");

        return;
    }

    try{

        const payload =
        token.split('.')[1];

        const decoded =
        JSON.parse(
            atob(payload)
        );

        document.getElementById("result")
        .innerText =
        JSON.stringify(decoded, null, 2);

    }

    catch(error){

        document.getElementById("result")
        .innerText =
        "Invalid JWT Token";

    }

}

</script>

</body>
</html>
