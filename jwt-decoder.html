<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JWT Decoder</title>

<meta name="description"
content="Decode JWT tokens instantly online free.">

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:180px;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    outline:none;
    resize:none;
    font-size:15px;
}

button{
    margin-top:20px;
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.output{
    margin-top:30px;
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    text-align:left;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
}

.section{
    margin-top:20px;
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
    color:#38bdf8;
}

.note{
    margin-top:20px;
    text-align:center;
    color:#cbd5e1;
}

</style>

</head>

<body>

<div class="container">

<h1>JWT Decoder</h1>

<p style="text-align:center;">
Decode JWT tokens instantly.
</p>

<textarea
id="token"
placeholder="Paste JWT token here..."></textarea>

<button onclick="decodeJWT()">
Decode JWT
</button>

<div class="output"
id="output">
Decoded JWT data will appear here...
</div>

<div class="note">
Useful for APIs, authentication & backend debugging.
</div>

</div>

<script>

function decodeJWT(){

    const token =
    document.getElementById("token").value;

    const output =
    document.getElementById("output");

    if(token.trim() === ""){

        output.innerHTML =
        "Please enter JWT token.";

        return;

    }

    try{

        const parts =
        token.split(".");

        if(parts.length !== 3){

            output.innerHTML =
            "Invalid JWT token.";

            return;

        }

        const header =
        JSON.parse(atob(parts[0]));

        const payload =
        JSON.parse(atob(parts[1]));

        output.innerHTML =

        `<div class="section">

        <div class="section-title">
        Header
        </div>

        <pre>
${JSON.stringify(header,null,2)}
        </pre>

        </div>

        <div class="section">

        <div class="section-title">
        Payload
        </div>

        <pre>
${JSON.stringify(payload,null,2)}
        </pre>

        </div>`;

    }

    catch(error){

        output.innerHTML =
        "Invalid JWT token format.";

    }

}

</script>

</body>
</html>
