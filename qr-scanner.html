<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QR Scanner Online Free</title>

<meta name="description"
content="Scan QR code online free using camera. Fast QR scanner tool.">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

#reader{
    width:100%;
    margin-top:20px;
    border-radius:10px;
    overflow:hidden;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#1e293b;
    border-radius:10px;
    word-break:break-word;
}

a{
    color:#22c55e;
}

</style>

</head>

<body>

<div class="container">

<h1>QR Scanner</h1>

<p>
Scan QR codes instantly using your camera.
</p>

<div id="reader"></div>

<div class="result" id="result">
Scanned result will appear here
</div>

</div>

<script>

function onScanSuccess(decodedText){

    document.getElementById("result")
    .innerHTML =
    `
    <strong>Scanned Result:</strong>
    <br><br>
    <a href="${decodedText}"
    target="_blank">
    ${decodedText}
    </a>
    `;

}

const html5QrCode =
new Html5QrcodeScanner(
    "reader",
    {
        fps:10,
        qrbox:250
    }
);

html5QrCode.render(onScanSuccess);

</script>

</body>
</html>
