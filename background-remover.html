<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Background Remover Online Free</title>

<meta name="description"
content="Remove image background online free. Create transparent PNG images instantly.">

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/browser.js"></script>

<style>

body{
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#0f172a;
    padding:30px;
    border-radius:14px;
}

input{
    margin-top:20px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

img{
    margin-top:20px;
    max-width:100%;
    border-radius:12px;
    background:white;
}

#downloadBtn{
    display:none;
    margin-top:20px;
    padding:12px 20px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    display:inline-block;
}

.loader{
    display:none;
    margin-top:20px;
    color:#22c55e;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Background Remover</h1>

<p>
Remove image background online free.
</p>

<input type="file" id="imageInput" accept="image/*">

<br>

<button onclick="removeBG()">
Remove Background
</button>

<div class="loader" id="loader">
Processing Image...
</div>

<br>

<img id="resultImage" style="display:none;">

<br>

<a id="downloadBtn">
Download PNG
</a>

</div>

<script>

async function removeBG(){

    const input =
    document.getElementById("imageInput");

    if(!input.files.length){
        alert("Please upload image");
        return;
    }

    const loader =
    document.getElementById("loader");

    loader.style.display = "block";

    const file = input.files[0];

    try{

        const blob =
        await removeBackground(file);

        const url =
        URL.createObjectURL(blob);

        const resultImage =
        document.getElementById("resultImage");

        resultImage.src = url;

        resultImage.style.display =
        "block";

        const downloadBtn =
        document.getElementById("downloadBtn");

        downloadBtn.href = url;

        downloadBtn.download =
        "background-removed.png";

        downloadBtn.style.display =
        "inline-block";

    }

    catch(error){

        alert("Background removal failed");

    }

    loader.style.display = "none";

}

</script>

</body>
</html>
